<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUPERHIRN // Neural Interface</title>
<style>
  :root {
    --cyan: #00f5ff;
    --purple: #bf00ff;
    --pink: #ff006e;
    --green: #00ff88;
    --dark: #020408;
    --dark2: #050d14;
    --panel: rgba(0, 245, 255, 0.04);
    --border: rgba(0, 245, 255, 0.15);
    --glow-cyan: 0 0 20px rgba(0,245,255,0.4), 0 0 60px rgba(0,245,255,0.1);
    --glow-purple: 0 0 20px rgba(191,0,255,0.4), 0 0 60px rgba(191,0,255,0.1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--dark);
    color: #c0d8e8;
    font-family: 'Courier New', monospace;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── Canvas Background ── */
  #bg-canvas {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  /* ── Scanlines Overlay ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,245,255,0.015) 2px,
      rgba(0,245,255,0.015) 4px
    );
    pointer-events: none;
    z-index: 1;
  }

  /* ── Header ── */
  header {
    position: relative;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 28px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(0,245,255,0.06) 0%, transparent 100%);
    backdrop-filter: blur(12px);
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .brain-icon {
    width: 38px; height: 38px;
    position: relative;
    flex-shrink: 0;
  }

  .brain-icon svg {
    width: 100%; height: 100%;
    filter: drop-shadow(0 0 8px var(--cyan));
    animation: brainPulse 3s ease-in-out infinite;
  }

  @keyframes brainPulse {
    0%,100% { filter: drop-shadow(0 0 8px var(--cyan)); }
    50% { filter: drop-shadow(0 0 20px var(--cyan)) drop-shadow(0 0 40px var(--purple)); }
  }

  .logo-text {
    display: flex; flex-direction: column;
  }

  .logo-title {
    font-size: 1.4rem;
    font-weight: bold;
    letter-spacing: 0.3em;
    color: var(--cyan);
    text-shadow: var(--glow-cyan);
    text-transform: uppercase;
  }

  .logo-sub {
    font-size: 0.6rem;
    letter-spacing: 0.25em;
    color: rgba(0,245,255,0.5);
    text-transform: uppercase;
  }

  .header-status {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .status-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    background: rgba(0,245,255,0.05);
    cursor: pointer;
    transition: all 0.3s;
  }

  .status-pill:hover {
    border-color: var(--cyan);
    background: rgba(0,245,255,0.1);
    box-shadow: var(--glow-cyan);
  }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #444;
    transition: all 0.3s;
  }

  .status-dot.online {
    background: var(--green);
    box-shadow: 0 0 8px var(--green);
    animation: dotBlink 2s ease-in-out infinite;
  }

  .status-dot.offline { background: var(--pink); box-shadow: 0 0 8px var(--pink); }
  .status-dot.connecting {
    background: #ffaa00;
    box-shadow: 0 0 8px #ffaa00;
    animation: dotBlink 0.5s ease-in-out infinite;
  }

  @keyframes dotBlink {
    0%,100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .settings-btn {
    background: none;
    border: 1px solid var(--border);
    color: rgba(0,245,255,0.6);
    width: 36px; height: 36px;
    border-radius: 8px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.3s;
    font-size: 1rem;
  }

  .settings-btn:hover {
    border-color: var(--cyan);
    color: var(--cyan);
    box-shadow: var(--glow-cyan);
    transform: rotate(90deg);
  }

  /* ── Main Layout ── */
  .main {
    position: relative;
    z-index: 5;
    flex: 1;
    display: flex;
    overflow: hidden;
  }

  /* ── Sidebar ── */
  .sidebar {
    width: 220px;
    border-right: 1px solid var(--border);
    padding: 20px 14px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    background: rgba(0,245,255,0.02);
    backdrop-filter: blur(8px);
    overflow-y: auto;
  }

  .sidebar-label {
    font-size: 0.6rem;
    letter-spacing: 0.25em;
    color: rgba(0,245,255,0.4);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .model-display {
    padding: 10px 12px;
    border: 1px solid rgba(191,0,255,0.3);
    border-radius: 8px;
    background: rgba(191,0,255,0.05);
    font-size: 0.72rem;
    color: var(--purple);
    text-shadow: 0 0 10px rgba(191,0,255,0.5);
    word-break: break-all;
    min-height: 36px;
    display: flex;
    align-items: center;
  }

  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.68rem;
    padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }

  .stat-label { color: rgba(255,255,255,0.35); letter-spacing: 0.08em; }
  .stat-val { color: var(--cyan); font-weight: bold; }

  .new-chat-btn {
    margin-top: auto;
    padding: 10px;
    border: 1px solid rgba(0,245,255,0.3);
    border-radius: 8px;
    background: rgba(0,245,255,0.05);
    color: var(--cyan);
    font-family: inherit;
    font-size: 0.72rem;
    letter-spacing: 0.15em;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.3s;
  }

  .new-chat-btn:hover {
    background: rgba(0,245,255,0.12);
    box-shadow: var(--glow-cyan);
    border-color: var(--cyan);
  }

  /* ── Chat Area ── */
  .chat-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px 32px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    scroll-behavior: smooth;
  }

  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb {
    background: rgba(0,245,255,0.2);
    border-radius: 2px;
  }

  /* ── Empty State ── */
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    opacity: 0.7;
    pointer-events: none;
  }

  .empty-state .big-brain {
    width: 100px; height: 100px;
    animation: float 4s ease-in-out infinite;
  }

  @keyframes float {
    0%,100% { transform: translateY(0px); }
    50% { transform: translateY(-12px); }
  }

  .empty-state h2 {
    font-size: 1.1rem;
    letter-spacing: 0.3em;
    color: rgba(0,245,255,0.5);
    text-transform: uppercase;
  }

  .empty-state p {
    font-size: 0.72rem;
    color: rgba(255,255,255,0.3);
    letter-spacing: 0.1em;
    text-align: center;
    max-width: 300px;
    line-height: 1.8;
  }

  /* ── Messages ── */
  .message {
    display: flex;
    gap: 14px;
    max-width: 85%;
    animation: msgIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    opacity: 0;
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(16px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .message.user { align-self: flex-end; flex-direction: row-reverse; }
  .message.assistant { align-self: flex-start; }

  .avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.85rem;
    flex-shrink: 0;
    position: relative;
  }

  .avatar::after {
    content: '';
    position: absolute;
    inset: -2px;
    border-radius: 50%;
    border: 1px solid transparent;
    animation: avatarSpin 6s linear infinite;
  }

  .message.user .avatar {
    background: linear-gradient(135deg, rgba(191,0,255,0.3), rgba(255,0,110,0.3));
    border: 1px solid rgba(191,0,255,0.5);
    box-shadow: 0 0 12px rgba(191,0,255,0.3);
  }

  .message.user .avatar::after {
    border-top-color: var(--purple);
  }

  .message.assistant .avatar {
    background: linear-gradient(135deg, rgba(0,245,255,0.3), rgba(0,255,136,0.2));
    border: 1px solid rgba(0,245,255,0.5);
    box-shadow: 0 0 12px rgba(0,245,255,0.3);
  }

  .message.assistant .avatar::after {
    border-top-color: var(--cyan);
  }

  @keyframes avatarSpin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  .bubble {
    padding: 14px 18px;
    border-radius: 12px;
    font-size: 0.88rem;
    line-height: 1.75;
    position: relative;
    max-width: 100%;
    word-wrap: break-word;
    white-space: pre-wrap;
  }

  .message.user .bubble {
    background: linear-gradient(135deg, rgba(191,0,255,0.15), rgba(255,0,110,0.08));
    border: 1px solid rgba(191,0,255,0.25);
    border-top-right-radius: 2px;
    color: #e0c8ff;
  }

  .message.assistant .bubble {
    background: linear-gradient(135deg, rgba(0,245,255,0.06), rgba(0,255,136,0.04));
    border: 1px solid rgba(0,245,255,0.18);
    border-top-left-radius: 2px;
    color: #c8eeff;
  }

  .bubble::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    border-radius: 12px 12px 0 0;
    background: linear-gradient(90deg, transparent, rgba(0,245,255,0.4), transparent);
    opacity: 0.5;
  }

  .message.user .bubble::before {
    background: linear-gradient(90deg, transparent, rgba(191,0,255,0.5), transparent);
  }

  /* ── Typing Indicator ── */
  .typing-bubble {
    display: flex; align-items: center; gap: 5px;
    padding: 14px 18px;
  }

  .typing-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--cyan);
    animation: typingBounce 1.2s ease-in-out infinite;
    box-shadow: 0 0 6px var(--cyan);
  }

  .typing-dot:nth-child(2) { animation-delay: 0.2s; background: var(--purple); box-shadow: 0 0 6px var(--purple); }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; background: var(--green); box-shadow: 0 0 6px var(--green); }

  @keyframes typingBounce {
    0%,60%,100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-8px); opacity: 1; }
  }

  /* ── Cursor blink for streaming ── */
  .cursor {
    display: inline-block;
    width: 2px;
    height: 1em;
    background: var(--cyan);
    margin-left: 2px;
    vertical-align: text-bottom;
    animation: cursorBlink 0.8s step-end infinite;
    box-shadow: 0 0 6px var(--cyan);
  }

  @keyframes cursorBlink {
    0%,100% { opacity: 1; }
    50% { opacity: 0; }
  }

  /* ── Input Area ── */
  .input-area {
    padding: 20px 32px 24px;
    border-top: 1px solid var(--border);
    background: linear-gradient(0deg, rgba(0,245,255,0.04) 0%, transparent 100%);
    backdrop-filter: blur(12px);
  }

  .input-wrapper {
    display: flex;
    gap: 12px;
    align-items: flex-end;
    position: relative;
  }

  .input-wrapper::before {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 14px;
    background: linear-gradient(135deg, rgba(0,245,255,0.15), rgba(191,0,255,0.15));
    z-index: -1;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .input-wrapper:focus-within::before { opacity: 1; }

  #user-input {
    flex: 1;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(0,245,255,0.2);
    border-radius: 12px;
    padding: 14px 18px;
    color: #d0eeff;
    font-family: 'Courier New', monospace;
    font-size: 0.88rem;
    resize: none;
    min-height: 52px;
    max-height: 180px;
    outline: none;
    line-height: 1.6;
    transition: border-color 0.3s, box-shadow 0.3s;
    overflow-y: auto;
  }

  #user-input::placeholder { color: rgba(0,245,255,0.25); }
  #user-input:focus {
    border-color: rgba(0,245,255,0.5);
    box-shadow: 0 0 0 1px rgba(0,245,255,0.1), inset 0 0 20px rgba(0,245,255,0.03);
  }

  .send-btn {
    width: 52px; height: 52px;
    border-radius: 12px;
    background: linear-gradient(135deg, rgba(0,245,255,0.15), rgba(191,0,255,0.15));
    border: 1px solid rgba(0,245,255,0.3);
    color: var(--cyan);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.3s;
    flex-shrink: 0;
    position: relative;
    overflow: hidden;
  }

  .send-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(0,245,255,0.3), rgba(191,0,255,0.3));
    opacity: 0;
    transition: opacity 0.3s;
  }

  .send-btn:hover { box-shadow: var(--glow-cyan); border-color: var(--cyan); transform: scale(1.05); }
  .send-btn:hover::before { opacity: 1; }
  .send-btn:active { transform: scale(0.96); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .send-btn svg { position: relative; z-index: 1; transition: transform 0.3s; }
  .send-btn:hover svg { transform: translateX(2px) translateY(-2px); }

  .input-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
    font-size: 0.62rem;
    color: rgba(0,245,255,0.25);
    letter-spacing: 0.1em;
  }

  /* ── Settings Modal ── */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(8px);
    z-index: 100;
    align-items: center;
    justify-content: center;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: #070f18;
    border: 1px solid rgba(0,245,255,0.2);
    border-radius: 16px;
    padding: 32px;
    width: 440px;
    max-width: 95vw;
    box-shadow: 0 0 60px rgba(0,245,255,0.1), 0 0 120px rgba(191,0,255,0.05);
    animation: modalIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.88) translateY(20px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .modal-title {
    font-size: 1rem;
    letter-spacing: 0.25em;
    color: var(--cyan);
    text-transform: uppercase;
    text-shadow: var(--glow-cyan);
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .field-group { margin-bottom: 20px; }

  .field-label {
    font-size: 0.68rem;
    letter-spacing: 0.15em;
    color: rgba(0,245,255,0.5);
    text-transform: uppercase;
    margin-bottom: 8px;
    display: block;
  }

  .field-input {
    width: 100%;
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(0,245,255,0.2);
    border-radius: 8px;
    padding: 10px 14px;
    color: #c0d8e8;
    font-family: 'Courier New', monospace;
    font-size: 0.82rem;
    outline: none;
    transition: border-color 0.3s, box-shadow 0.3s;
  }

  .field-input:focus {
    border-color: rgba(0,245,255,0.5);
    box-shadow: 0 0 0 1px rgba(0,245,255,0.1);
  }

  .modal-actions {
    display: flex;
    gap: 12px;
    margin-top: 28px;
  }

  .btn-primary {
    flex: 1;
    padding: 11px;
    background: linear-gradient(135deg, rgba(0,245,255,0.2), rgba(191,0,255,0.15));
    border: 1px solid rgba(0,245,255,0.4);
    border-radius: 8px;
    color: var(--cyan);
    font-family: inherit;
    font-size: 0.78rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
  }

  .btn-primary:hover {
    box-shadow: var(--glow-cyan);
    background: linear-gradient(135deg, rgba(0,245,255,0.3), rgba(191,0,255,0.2));
  }

  .btn-secondary {
    padding: 11px 20px;
    background: transparent;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    color: rgba(255,255,255,0.4);
    font-family: inherit;
    font-size: 0.78rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.3s;
  }

  .btn-secondary:hover {
    border-color: rgba(255,255,255,0.3);
    color: rgba(255,255,255,0.7);
  }

  /* ── Toast ── */
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: rgba(0,20,30,0.95);
    border: 1px solid rgba(0,245,255,0.3);
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 0.78rem;
    letter-spacing: 0.1em;
    color: var(--cyan);
    z-index: 200;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    pointer-events: none;
    white-space: nowrap;
  }

  #toast.show { transform: translateX(-50%) translateY(0); }
  #toast.error { border-color: rgba(255,0,110,0.4); color: var(--pink); }

  /* ── Hex grid decorative ── */
  .hex-deco {
    position: fixed;
    bottom: -60px; right: -60px;
    width: 300px; height: 300px;
    opacity: 0.04;
    pointer-events: none;
    z-index: 2;
  }

  .hex-deco2 {
    position: fixed;
    top: 60px; left: -80px;
    width: 240px; height: 240px;
    opacity: 0.03;
    pointer-events: none;
    z-index: 2;
    transform: rotate(30deg);
  }

  /* ── Corner Brackets ── */
  .corner-tl, .corner-br {
    position: fixed;
    width: 40px; height: 40px;
    pointer-events: none;
    z-index: 3;
  }

  .corner-tl { top: 8px; left: 8px;
    border-top: 1px solid rgba(0,245,255,0.3);
    border-left: 1px solid rgba(0,245,255,0.3);
  }

  .corner-br { bottom: 8px; right: 8px;
    border-bottom: 1px solid rgba(0,245,255,0.3);
    border-right: 1px solid rgba(0,245,255,0.3);
  }

  /* ── Responsive ── */
  @media (max-width: 640px) {
    .sidebar { display: none; }
    #messages { padding: 16px; }
    .input-area { padding: 14px 16px 18px; }
  }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<!-- Decorative corners -->
<div class="corner-tl"></div>
<div class="corner-br"></div>

<!-- Decorative SVG grid -->
<svg class="hex-deco" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <pattern id="hexPat" x="0" y="0" width="30" height="34.64" patternUnits="userSpaceOnUse">
    <polygon points="15,1 29,8.5 29,26.14 15,33.64 1,26.14 1,8.5" stroke="cyan" stroke-width="0.5" fill="none"/>
  </pattern>
  <rect width="300" height="300" fill="url(#hexPat)"/>
</svg>

<svg class="hex-deco2" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <pattern id="hexPat2" x="0" y="0" width="30" height="34.64" patternUnits="userSpaceOnUse">
    <polygon points="15,1 29,8.5 29,26.14 15,33.64 1,26.14 1,8.5" stroke="cyan" stroke-width="0.5" fill="none"/>
  </pattern>
  <rect width="300" height="300" fill="url(#hexPat2)"/>
</svg>

<!-- Header -->
<header>
  <div class="logo">
    <div class="brain-icon">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M20 6C15 6 11 9 11 13C11 14 11.5 15 12 16C10.5 16.5 9 18 9 20C9 22 10 23.5 11.5 24.5C11 25.5 11 26.5 11 27.5C11 30.5 13.5 33 16.5 33L20 33L23.5 33C26.5 33 29 30.5 29 27.5C29 26.5 29 25.5 28.5 24.5C30 23.5 31 22 31 20C31 18 29.5 16.5 28 16C28.5 15 29 14 29 13C29 9 25 6 20 6Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M20 6L20 33" stroke="currentColor" stroke-width="0.8" opacity="0.4"/>
        <path d="M14 12C14 12 15 14 16 15C17 16 17 18 16 19" stroke="currentColor" stroke-width="1" stroke-linecap="round"/>

<!-- Main -->
<div class="main">
  <!-- Sidebar -->

          <path d="M50 12L50 88" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
          <path d="M33 28C33 28 37 34 40 37C43 40 43 46 40 49" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>

<!-- Settings Modal -->
<div class="modal-overlay" id="settings-modal">
  <div class="modal">
    <div class="modal-title">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M2 12h3M19 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12"/></svg>
      Systemkonfiguration
    </div>

    <div class="field-group">
      <label class="field-label">LM Studio API URL</label>
      <input class="field-input" id="api-url-input" type="text" placeholder="http://localhost:1234/v1" value="http://localhost:1234/v1">
    </div>

    <div class="field-group">
      <label class="field-label">System-Prompt (optional)</label>
      <textarea class="field-input" id="system-prompt-input" rows="3" placeholder="Du bist ein hilfreicher Assistent..." style="resize:vertical"></textarea>
    </div>

    <div class="field-group">
      <label class="field-label">Temperatur: <span id="temp-label">0.7</span></label>
      <input type="range" id="temp-input" min="0" max="2" step="0.05" value="0.7"
        style="width:100%; accent-color:var(--cyan); margin-top:6px; cursor:pointer"
        oninput="document.getElementById('temp-label').textContent = this.value">
    </div>

    <div class="modal-actions">
      <button class="btn-primary" onclick="saveAndConnect()">Verbinden &amp; Speichern</button>
      <button class="btn-secondary" onclick="closeSettings()">Abbrechen</button>
    </div>
  </div>

<!-- Toast -->
<div id="toast"></div>

<script>
// ── State ──
let config = {
  apiUrl: localStorage.getItem('sh_apiUrl') || 'http://localhost:1234/v1',
  systemPrompt: localStorage.getItem('sh_systemPrompt') || '',
  temperature: parseFloat(localStorage.getItem('sh_temp') || '0.7'),
};

let messages = [];
let isStreaming = false;
let tokenCount = 0;
let activeModel = null;

// ── Canvas Particle System ──
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');

let particles = [];
let connections = [];
let W, H;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

class Particle {
  constructor() { this.reset(); }
  reset() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.vx = (Math.random() - 0.5) * 0.3;
    this.vy = (Math.random() - 0.5) * 0.3;
    this.r = Math.random() * 1.5 + 0.5;
    this.alpha = Math.random() * 0.5 + 0.1;
    this.color = Math.random() > 0.6 ? '#00f5ff' : Math.random() > 0.5 ? '#bf00ff' : '#00ff88';
    this.pulse = Math.random() * Math.PI * 2;
    this.pulseSpeed = 0.02 + Math.random() * 0.03;
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    this.pulse += this.pulseSpeed;
    if (this.x < 0 || this.x > W || this.y < 0 || this.y > H) this.reset();
  }
  draw() {
    const a = this.alpha * (0.7 + 0.3 * Math.sin(this.pulse));
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2);
    ctx.fillStyle = this.color + Math.floor(a * 255).toString(16).padStart(2,'0');
    ctx.fill();
  }
}

for (let i = 0; i < 100; i++) particles.push(new Particle());

// Horizontal scan line
let scanY = 0;

function animate() {
  ctx.clearRect(0, 0, W, H);

  // Draw connections
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (dist < 120) {
        const alpha = (1 - dist / 120) * 0.12;
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.strokeStyle = `rgba(0,245,255,${alpha})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }

  // Draw particles
  particles.forEach(p => { p.update(); p.draw(); });

  // Scan line
  scanY = (scanY + 0.5) % H;
  const scanGrad = ctx.createLinearGradient(0, scanY - 40, 0, scanY + 40);
  scanGrad.addColorStop(0, 'transparent');
  scanGrad.addColorStop(0.5, 'rgba(0,245,255,0.025)');
  scanGrad.addColorStop(1, 'transparent');
  ctx.fillStyle = scanGrad;
  ctx.fillRect(0, scanY - 40, W, 80);

  requestAnimationFrame(animate);
}
animate();

// ── Toast ──
let toastTimer;
function toast(msg, isError = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = isError ? 'error show' : 'show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = isError ? 'error' : ''; }, 3000);
}

// ── Settings ──
function openSettings() {
  document.getElementById('api-url-input').value = config.apiUrl;
  document.getElementById('system-prompt-input').value = config.systemPrompt;
  document.getElementById('temp-input').value = config.temperature;
  document.getElementById('temp-label').textContent = config.temperature;
  document.getElementById('settings-modal').classList.add('open');
}

function closeSettings() {
  document.getElementById('settings-modal').classList.remove('open');
}

document.getElementById('settings-modal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeSettings();
});

async function saveAndConnect() {
  config.apiUrl = document.getElementById('api-url-input').value.replace(/\/$/, '');
  config.systemPrompt = document.getElementById('system-prompt-input').value;
  config.temperature = parseFloat(document.getElementById('temp-input').value);
  localStorage.setItem('sh_apiUrl', config.apiUrl);
  localStorage.setItem('sh_systemPrompt', config.systemPrompt);
  localStorage.setItem('sh_temp', config.temperature);
  closeSettings();
  await checkConnection();
}

// ── Status ──
function setStatus(state, label, model) {
  const dot = document.getElementById('status-dot');
  const txt = document.getElementById('status-text');
  dot.className = 'status-dot ' + state;
  txt.textContent = label;
  if (model) {
    activeModel = model;
    document.getElementById('model-name').textContent = model;
    document.getElementById('send-btn').disabled = false;
  } else if (state === 'offline') {
    activeModel = null;
    document.getElementById('model-name').textContent = '— nicht verbunden —';
    document.getElementById('send-btn').disabled = true;
  }
  const url = new URL(config.apiUrl);
  document.getElementById('endpoint-display').textContent = url.port || '80';
}

async function checkConnection() {
  setStatus('connecting', 'VERBINDE...');
  try {
    const res = await fetch(config.apiUrl + '/models');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const models = data.data || [];
    const modelId = models.length > 0 ? models[0].id : 'unknown';
    const shortModel = modelId.split('/').pop().split('\\').pop();
    setStatus('online', 'ONLINE', shortModel);
    toast('Verbunden mit: ' + shortModel);
  } catch (e) {
    setStatus('offline', 'OFFLINE');
    toast('Verbindung fehlgeschlagen. LM Studio läuft?', true);
  }
}

// ── Chat ──
function buildBuildPayload() {
  const systemMsg = config.systemPrompt
    ? [{ role: 'system', content: config.systemPrompt }]
    : [];
  return [...systemMsg, ...messages.map(m => ({ role: m.role, content: m.content }))];
}

function estimateTokens(text) {
  return Math.ceil(text.split(/\s+/).length * 1.3);
}

function updateStats() {
  document.getElementById('msg-count').textContent = messages.length;
  tokenCount = messages.reduce((s, m) => s + estimateTokens(m.content), 0);
  document.getElementById('token-count').textContent = tokenCount.toLocaleString();
}

function addMessage(role, content) {
  // Hide empty state
  const emptyState = document.getElementById('empty-state');
  if (emptyState) emptyState.remove();

  const msgList = document.getElementById('messages');

  const msgEl = document.createElement('div');
  msgEl.className = `message ${role}`;

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'user' ? '⬡' : '◈';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = content;

  msgEl.appendChild(avatar);
  msgEl.appendChild(bubble);
  msgList.appendChild(msgEl);
  msgList.scrollTop = msgList.scrollHeight;

  return bubble;
}

function showTyping() {
  const emptyState = document.getElementById('empty-state');
  if (emptyState) emptyState.remove();

  const msgList = document.getElementById('messages');
  const msgEl = document.createElement('div');
  msgEl.className = 'message assistant';
  msgEl.id = 'typing-msg';

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = '◈';

  const bubble = document.createElement('div');
  bubble.className = 'bubble typing-bubble';

  for (let i = 0; i < 3; i++) {
    const dot = document.createElement('span');
    dot.className = 'typing-dot';
    bubble.appendChild(dot);
  }

  msgEl.appendChild(avatar);
  msgEl.appendChild(bubble);
  msgList.appendChild(msgEl);
  msgList.scrollTop = msgList.scrollHeight;
  return msgEl;
}

function removeTyping() {
  const el = document.getElementById('typing-msg');
  if (el) el.remove();
}

async function sendMessage() {
  if (isStreaming || !activeModel) return;

  const input = document.getElementById('user-input');
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  input.style.height = '';
  document.getElementById('char-count').textContent = '0 Zeichen';

  messages.push({ role: 'user', content: text });
  addMessage('user', text);
  updateStats();

  isStreaming = true;
  document.getElementById('send-btn').disabled = true;
  input.disabled = true;

  const typingEl = showTyping();

  try {
    const res = await fetch(config.apiUrl + '/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: activeModel,
        messages: buildBuildPayload(),
        temperature: config.temperature,
        stream: true,
      }),
    });

    if (!res.ok) throw new Error('HTTP ' + res.status);

    removeTyping();
    const bubble = addMessage('assistant', '');
    const cursor = document.createElement('span');
    cursor.className = 'cursor';
    bubble.appendChild(cursor);

    let fullContent = '';
    const reader = res.body.getReader();
    const decoder = new TextDecoder();

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      const chunk = decoder.decode(value, { stream: true });
      const lines = chunk.split('\n');

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        const raw = line.slice(6).trim();
        if (raw === '[DONE]') break;
        try {
          const json = JSON.parse(raw);
          const delta = json.choices?.[0]?.delta?.content || '';
          if (delta) {
            fullContent += delta;
            bubble.textContent = fullContent;
            bubble.appendChild(cursor);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
          }
        } catch {}
      }
    }

    cursor.remove();
    messages.push({ role: 'assistant', content: fullContent });
    updateStats();

  } catch (e) {
    removeTyping();
    toast('Fehler beim Senden: ' + e.message, true);
    setStatus('offline', 'OFFLINE');
    activeModel = null;
    document.getElementById('model-name').textContent = '— nicht verbunden —';
  }

  isStreaming = false;
  document.getElementById('send-btn').disabled = !activeModel;
  input.disabled = false;
  input.focus();
}

function newChat() {
  messages = [];
  tokenCount = 0;
  updateStats();
  const msgList = document.getElementById('messages');
  msgList.innerHTML = '';
  const emptyState = document.createElement('div');
  emptyState.className = 'empty-state';
  emptyState.id = 'empty-state';
  emptyState.innerHTML = `
    <svg class="big-brain" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" style="color:var(--cyan); filter: drop-shadow(0 0 20px var(--cyan)); width:100px; height:100px; animation: float 4s ease-in-out infinite;">
      <path d="M50 12C36 12 26 21 26 32C26 35 27 38 29 41C25 43 22 47 22 52C22 57 25 61 29 63C28 66 27 69 27 72C27 80 33 88 42 88L50 88L58 88C67 88 73 80 73 72C73 69 72 66 71 63C75 61 78 57 78 52C78 47 75 43 71 41C73 38 74 35 74 32C74 21 64 12 50 12Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
      <path d="M50 12L50 88" stroke="currentColor" stroke-width="1.5" opacity="0.3"/>
      <circle cx="50" cy="52" r="5" fill="currentColor" opacity="0.5"/>
    </svg>
    <h2>Neuer Chat gestartet</h2>
    <p>Bereit für eine neue Unterhaltung.</p>`;
  msgList.appendChild(emptyState);
  toast('Neuer Chat gestartet');
}

// ── Input auto-resize + enter to send ──
const userInput = document.getElementById('user-input');

userInput.addEventListener('input', () => {
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 180) + 'px';
  document.getElementById('char-count').textContent = userInput.value.length + ' Zeichen';
});

userInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (!isStreaming && activeModel) sendMessage();
  }
});

// ── Init ──
(async () => {
  document.getElementById('api-url-input').value = config.apiUrl;
  await checkConnection();
  document.getElementById('user-input').focus();
})();
</script>
